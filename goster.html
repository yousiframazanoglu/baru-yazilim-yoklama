<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BARÜ Yazılım Birimi — Yoklama QR</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --line: #2a2e37;
    --text: #eef0f3;
    --muted: #9aa3af;
    --amber: #ffb648;
    --cyan: #5ec8d8;
    --danger: #ff6b6b;
    --mono: "JetBrains Mono", ui-monospace, monospace;
    --sans: "Inter", -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(255, 182, 72, 0.06), transparent 45%),
      radial-gradient(circle at 85% 100%, rgba(94, 200, 216, 0.05), transparent 45%);
    color: var(--text);
    font-family: var(--sans);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
  }
  .wrap {
    width: 100%;
    max-width: 560px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  .kicker {
    font-family: var(--mono);
    font-size: 15px;
    color: var(--cyan);
  }
  h1 {
    font-size: clamp(22px, 4vw, 30px);
    font-weight: 700;
    margin: 0;
    line-height: 1.25;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 30px 60px -30px rgba(0, 0, 0, 0.7);
    position: relative;
  }
  #qr { line-height: 0; }
  #qr img { display: block; }
  .card.is-expired #qr { opacity: 0.15; filter: blur(2px); }
  .hint {
    font-family: var(--mono);
    font-size: 15px;
    color: var(--muted);
  }
  .hint .amber { color: var(--amber); }
  .countdown {
    font-family: var(--mono);
    font-size: 14px;
    color: var(--muted);
  }
  .countdown .time { color: var(--text); font-weight: 700; }
  .countdown.is-low .time { color: var(--amber); }
  .geo {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--muted);
  }
  .geo .on { color: #8fd98a; }
  .geo .off { color: var(--danger); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="kicker">BARÜ Bilim ve Teknoloji Kulübü · Yazılım Birimi</div>
    <h1>Yoklama için telefonla okut</h1>
    <div class="card" id="card"><div id="qr"></div></div>
    <div class="hint"><span class="amber">&gt;</span> Öğrenci No ve Ad Soyad'ını gir, gönder.</div>
    <div class="countdown" id="countdown"></div>
    <div class="geo" id="geo"></div>
  </div>

  <script src="config.js"></script>
  <script>
    var TOKEN_TTL_MS = 20 * 60 * 1000; // Code.gs'teki TOKEN_TTL_MS ile aynı tut
    var ENDPOINT = window.YOKLAMA_ENDPOINT || null;

    var qrEl = document.getElementById("qr");
    var cardEl = document.getElementById("card");
    var countdownEl = document.getElementById("countdown");
    var geoEl = document.getElementById("geo");

    var session = { token: null, expiresAt: 0, lat: null, lng: null, accuracy: null };
    var countdownTimer = null;

    function baseUrl() {
      return new URL("./", window.location.href).href;
    }

    function drawQr(url) {
      qrEl.innerHTML = "";
      if (window.QRCode) {
        new QRCode(qrEl, {
          text: url,
          width: 280,
          height: 280,
          colorDark: "#0f1115",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });
      } else {
        qrEl.outerHTML =
          '<div style="width:280px;height:280px;display:flex;align-items:center;' +
          'justify-content:center;text-align:center;color:#0f1115;font-family:Inter,sans-serif;' +
          'font-size:14px;padding:16px;">QR kodu yüklenemedi.<br>' + url + '</div>';
      }
    }

    function randomToken() {
      return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
    }

    function notifyServer() {
      if (!ENDPOINT || ENDPOINT.indexOf("REPLACE_WITH") === 0) return;
      try {
        fetch(ENDPOINT, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "startSession",
            token: session.token,
            expiresAt: session.expiresAt,
            lat: session.lat,
            lng: session.lng,
            accuracy: session.accuracy
          })
        });
      } catch (err) {
        // sessizce geç — bir sonraki döngüde tekrar denenecek
      }
    }

    function startNewSession() {
      session.token = randomToken();
      session.expiresAt = Date.now() + TOKEN_TTL_MS;
      cardEl.classList.remove("is-expired");

      var url = baseUrl() + "?t=" + encodeURIComponent(session.token);
      drawQr(url);
      notifyServer();
      tickCountdown();
    }

    function tickCountdown() {
      if (countdownTimer) clearInterval(countdownTimer);
      countdownTimer = setInterval(function () {
        var remaining = session.expiresAt - Date.now();
        if (remaining <= 0) {
          clearInterval(countdownTimer);
          cardEl.classList.add("is-expired");
          countdownEl.innerHTML = "QR yenileniyor…";
          setTimeout(startNewSession, 800);
          return;
        }
        var m = Math.floor(remaining / 60000);
        var s = Math.floor((remaining % 60000) / 1000);
        countdownEl.classList.toggle("is-low", remaining < 60000);
        countdownEl.innerHTML =
          'Bu QR <span class="time">' + m + ":" + (s < 10 ? "0" : "") + s + "</span> sonra yenilenecek";
      }, 1000);
    }

    function setupGeo() {
      if (!navigator.geolocation) {
        geoEl.innerHTML = '<span class="off">✗ Konum kontrolü kapalı (tarayıcı desteklemiyor)</span>';
        startNewSession();
        return;
      }
      navigator.geolocation.getCurrentPosition(
        function (pos) {
          session.lat = pos.coords.latitude;
          session.lng = pos.coords.longitude;
          session.accuracy = pos.coords.accuracy;
          if (pos.coords.accuracy > 2000) {
            geoEl.innerHTML = '<span class="off">✗ Konum çok kaba tahminli (±' + Math.round(pos.coords.accuracy) +
              'm) — konum kontrolü bu oturum için kapalı</span>';
          } else {
            geoEl.innerHTML = '<span class="on">✓ Konum kontrolü açık (±' + Math.round(pos.coords.accuracy) +
              'm) — öğrenciler sınıfın yakınında olmalı</span>';
          }
          startNewSession();
        },
        function () {
          session.lat = null;
          session.lng = null;
          session.accuracy = null;
          geoEl.innerHTML = '<span class="off">✗ Konum kontrolü kapalı (izin verilmedi) — bu ekrana konum izni ver</span>';
          startNewSession();
        },
        { enableHighAccuracy: true, timeout: 8000 }
      );
    }

    if (!ENDPOINT || ENDPOINT.indexOf("REPLACE_WITH") === 0) {
      qrEl.outerHTML =
        '<div style="width:280px;height:280px;display:flex;align-items:center;' +
        'justify-content:center;text-align:center;color:#0f1115;font-family:Inter,sans-serif;' +
        'font-size:14px;padding:16px;">Sistem henüz bağlanmadı.<br>config.js ayarlanmamış.</div>';
    } else {
      setupGeo();
    }
  </script>
</body>
</html>
